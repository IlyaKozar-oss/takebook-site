ru:
  brand: Смотри тут
  description: Смотри тут помогает съёмочной группе организовать съёмочные дни, записывать и просматривать видеодубли, оставлять текстовые и голосовые замечания и видеть выбор режиссёра на iPhone и iPad.
  og_locale: ru_RU
  home_label: Смотри тут — главная
  skip: К содержимому
  navigation: Главная навигация
  language: Язык
  privacy: Политика конфиденциальности
  terms: Условия использования
  support: Поддержка
  documents: Документы приложения
  app_features: О приложении
  explore_workflow: Как это работает
  footer: Для историй, которые вы снимаете вместе.
  hero_eyebrow: Рабочее пространство съёмочной группы
  hero_line_one: Каждый дубль
  hero_line_two: на своём месте
  hero_description: Смотри тут объединяет видеодубли, замечания группы и выбор режиссёра в одном рабочем пространстве. Запишите или импортируйте дубль, обсудите детали и вернитесь к нужному варианту в любой момент.
  hero_caption: Для iPhone и iPad · На русском и английском
  preview_label: Пример проекта
  preview_status: В работе
  preview_day: Съёмочный день / 01
  preview_title: Белая ночь
  preview_location: Интерьер
  preview_take: Дубль 01
  preview_selected: Рабочий дубль
  preview_notes: 2 замечания
  preview_note_author: Режиссёр · Текстовое замечание
  preview_note_text: Задержимся на раскрытой книге чуть дольше перед движением к окну.
  about_eyebrow: Меньше поиска. Больше съёмки.
  about_line_one: Контекст остаётся
  about_line_two: рядом с дублем.
  about_description: Во время съёмки важно помнить, к какому дню относится видео, что заметила группа и какой вариант выбрал режиссёр. Смотри тут хранит эти детали рядом с материалом, чтобы к обсуждению было легко вернуться.
  features:
    - title: Понятное место для материала
      text: Откройте проект, посмотрите состав и роли группы, затем перейдите к съёмочному дню с датой, локацией и дублями. Нужное видео каждый раз находится в знакомой структуре.
    - title: Обсуждение рядом с видео
      text: Посмотрите дубль и оставьте текстовое или голосовое замечание. Записи привязаны к конкретному дублю и показывают автора, поэтому контекст обсуждения сохраняется.
    - title: Выбор режиссёра виден группе
      text: Режиссёр может отметить рабочий дубль съёмочного дня. После сохранения решения участники видят выбранный вариант, когда возвращаются к проекту.
  workflow_eyebrow: От съёмки к обсуждению
  workflow_heading: Съёмочный день в четырёх шагах.
  workflow_description: Пройдите путь от материала в проекте до решения режиссёра — с замечаниями под рукой.
  workflow_steps:
    - title: Откройте съёмочный день
      text: Найдите проект, проверьте состав группы, дату и локацию, затем откройте список дублей нужного дня.
    - title: Добавьте следующий дубль
      text: Запишите видео в приложении со звуком или без него либо импортируйте из медиатеки. При желании добавьте текстовое замечание и загрузите дубль в съёмочный день.
    - title: Посмотрите и обсудите
      text: Просмотрите видео, прослушайте голосовые и добавьте свои наблюдения об игре, композиции, движении камеры или звуке.
    - title: Сохраните решение
      text: Режиссёр отмечает выбранный дубль. Решение остаётся в съёмочном дне вместе с материалами и замечаниями, на которые опиралась группа.
  workflow_limit: Один дубль — до 60 секунд и 150 МБ. Приложение проверяет видео перед загрузкой.
  crew_eyebrow: Для тех, кто создаёт кадр
  crew_heading: Один проект. Разные взгляды.
  crew_description: Для короткометражных фильмов, учебных работ, музыкальных клипов и других съёмок, где группе нужно просматривать короткие дубли и сохранять общее обсуждение.
  crew_roles:
    - title: Режиссёрам
      text: Просматривайте дубли по очереди, оставляйте указания и отмечайте рабочий вариант, который группа сможет легко найти.
    - title: Операторам и звукорежиссёрам
      text: Добавляйте материал и фиксируйте конкретные замечания об изображении, движении камеры и звуке — текстом или голосом.
    - title: Остальным участникам группы
      text: Возвращайтесь к съёмочному дню, чтобы просмотреть материал, прочитать замечания и увидеть сохранённый выбор.
  practical_eyebrow: Перед следующей съёмкой
  practical_heading: Детали, которые пригодятся.
  practical_questions:
    - question: Как группа получает доступ?
      answer: Автор проекта может создать ссылку-приглашение и код для вступления. В списке группы видны роли участников; от роли зависят доступные действия, например выбор рабочего дубля. Для отдельного дубля также можно создать ссылку после проверки доступа.
    - question: Что произойдёт, если пропадёт интернет?
      answer: Ранее загруженные данные и сохранённые на устройстве медиа могут оставаться доступными. Неотправленные видеодубли, текстовые и голосовые замечания можно сохранить как локальные черновики. Для загрузки, публикации замечаний и сохранения общего решения нужно подключение; неотправленный черновик группа пока не видит.
    - question: Что доступно при просмотре?
      answer: Запускайте и останавливайте видео, переключайтесь в аудиорежим во время воспроизведения и слушайте голосовые замечания. Из списка съёмочного дня можно открыть другой дубль и вернуться к его обсуждению.
    - question: Какие устройства и языки поддерживаются?
      answer: Приложение «Смотри тут» предназначено для iPhone и iPad. Интерфейс доступен на русском и английском языках; светлая и тёмная темы следуют настройке устройства.
  documents_eyebrow: Важная информация
  documents_heading: Документы и поддержка
  documents_description: Информация об использовании «Смотри тут» и обращении с данными.
