  hero_line_two: In its place
  hero_description: Smotri tut brings video takes, crew feedback, and the director’s choice into one workspace. Record or import a take, discuss the details, and return to the right version when you need it.
  hero_caption: For iPhone and iPad · English and Russian
  preview_label: Demo project
  preview_status: In progress
  preview_day: Shooting day / 01
  preview_title: White Night
