<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  {% if page.draft_notice %}<meta name="robots" content="noindex, follow">{% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/mark.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}Takebook">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Takebook — главная">
        <img src="{{ '/assets/mark.svg' | relative_url }}" width="36" height="36" alt="">
        <span>Takebook</span>
      </a>
      <nav class="header-nav" aria-label="Главная навигация">
        <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Конфиденциальность</a>
        <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Поддержка <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer">
      <div><a class="footer-brand" href="{{ '/' | relative_url }}">Takebook</a><p>Для историй, которые вы снимаете вместе.</p></div>
      <nav aria-label="Документы приложения">
        <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
        <a href="{{ '/terms/' | relative_url }}">Условия использования</a>
        <a href="{{ '/support/' | relative_url }}">Поддержка</a>
      </nav>
    </footer>
  </div>
</body>
</html>
