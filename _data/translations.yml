  preview_note_author: Director · Text note
  preview_note_text: Hold on the open book a little longer before moving toward the window.
  about_eyebrow: Less searching. More shooting.
  about_line_one: Keep the context
  about_line_two: with every take.
  about_description: On a busy shoot, it helps to know which day a clip belongs to, what the crew noticed, and which take the director chose. Smotri tut keeps those details with the footage, ready for the next discussion.
  features:
    - title: A clear home for the footage
      text: Browse projects, see the crew and their roles, then open a shooting day with its date, location, and takes. Find the right material through the same structure each time.
    - title: Feedback beside the video
      text: Play a take and leave a text or recorded voice note. Remarks stay attached to that take, with the author shown, so the crew can revisit the discussion in context.
    - title: A visible director’s choice
      text: The director can select a working take for the shooting day. After the decision is saved, the crew can see which take was chosen when they return to the project.
  workflow_eyebrow: From the set to the discussion
  workflow_heading: A shooting day in four steps.
  workflow_description: Follow the footage from its project to the decision, with the feedback close at hand.
  workflow_steps:
    - title: Open the shooting day
      text: Find your project, check the crew, date, and location, and open the day’s list of takes.
    - title: Add the next take
      text: Record a video in the app, with or without sound, or import one from your library. Add an optional text note and upload it to the shooting day.
    - title: Watch and discuss
      text: Review the video, replay voice notes, and add your own observations about the performance, framing, movement, or sound.
    - title: Keep the decision
      text: The director marks the chosen take. The selection stays with the shooting day, alongside the footage and remarks that informed it.
  workflow_limit: Each take can be up to 60 seconds and 150 MB. The app checks the video before upload.
  crew_eyebrow: For the people making the shot
  crew_heading: One project. Different perspectives.
  crew_description: For short films, student productions, music videos, and other shoots where a crew needs to review short takes and keep a shared record of feedback.
  crew_roles:
    - title: Directors
      text: Review the takes in sequence, leave direction, and make the selected take easy for the crew to find.
    - title: Camera and sound crew
      text: Add footage and leave specific observations about the image, camera movement, or sound, using text or voice.
    - title: The wider crew
      text: Return to the shooting day to review the material, read the remarks, and see the saved selection.
  practical_eyebrow: Before your next shoot
  practical_heading: The details that matter.
  practical_questions:
    - question: How does the crew get access?
      answer: The project author can create an invitation link and a code for joining the project. The crew list shows each member’s role; actions such as selecting the working take depend on that role. A take can also have its own share link, created after access verification.
    - question: What happens if the connection drops?
      answer: Previously loaded data and locally saved media can remain available. Unsent video takes and text or voice notes can be kept as drafts on that device. Uploading, publishing notes, and saving shared decisions require a connection; an unsent draft is not yet visible to the crew.
    - question: What can I use during playback?
      answer: Play and pause the video, switch to audio mode while a take is playing, and listen to its voice notes. You can return to the shooting day’s list to review another take and its remarks.
    - question: Which devices and languages are supported?
      answer: Smotri tut is designed for iPhone and iPad. The interface is available in English and Russian, with light and dark appearance that follows your device setting.
